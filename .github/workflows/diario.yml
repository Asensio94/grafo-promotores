name: diario

on:
  schedule:
    - cron: "40 7 * * 1-6"  # tras la publicación del BOE y del BORME
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # la caché de textos del BOE evita volver a descargar lo ya leído; el índice del BORME no hace falta aquí
      - uses: actions/cache@v4
        with:
          path: data/cache/boe
          key: boe-${{ github.run_id }}
          restore-keys: boe-
      - name: BOE, BORME, grafo y web
        env:
          GRAFO_SAL: ${{ secrets.GRAFO_SAL }}
          PYTHONIOENCODING: utf-8
        run: |
          test -n "$GRAFO_SAL" || { echo "Falta el secreto GRAFO_SAL: sin él los seudónimos cambiarían"; exit 1; }
          python -m promotores.cli diario
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proyectos data/borme data/grafo.json docs
          git diff --cached --quiet || git commit -m "Actualización diaria $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
